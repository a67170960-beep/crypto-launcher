name: Build Crypto Launcher Runtime APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  crypto-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Crypto Client
        working-directory: crypto-client
        run: |
          set -e
          gradle wrapper --gradle-version 8.10.2 || true
          chmod +x gradlew 2>/dev/null || true
          ./gradlew build --no-daemon --stacktrace || gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-client-jar
          path: crypto-client/build/libs/*.jar
          if-no-files-found: warn

  runtime-apk:
    runs-on: ubuntu-latest
    needs: crypto-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: true
      - name: Checkout MojoLauncher
        run: |
          git clone --depth 1 --branch v3_openjdk https://github.com/MojoLauncher/MojoLauncher.git engine
          cd engine && git submodule update --init --recursive || true
      - name: Download Fabric API
        run: |
          mkdir -p bundled-mods
          curl -fsSL -o bundled-mods/fabric-api-1.21.4.jar \
            "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.119.2%2B1.21.4/fabric-api-0.119.2%2B1.21.4.jar" || true
          ls -la bundled-mods
      - uses: actions/download-artifact@v4
        with:
          name: crypto-client-jar
          path: client-jar
      - name: Brand + bundle mods + features
        run: |
          chmod +x patches/crypto-branding.sh
          mkdir -p engine/patches
          cp patches/crypto-branding.sh engine/patches/
          cp patches/CryptoBootstrap.java engine/patches/
          cd engine
          bash patches/crypto-branding.sh
          mkdir -p app_mojo/src/main/java/git/artdeell/mojo/crypto
          cp patches/CryptoBootstrap.java app_mojo/src/main/java/git/artdeell/mojo/crypto/
          mkdir -p app_mojo/src/main/assets/crypto-mods
          cp -v ../client-jar/*.jar app_mojo/src/main/assets/crypto-mods/ 2>/dev/null || true
          cp -v ../bundled-mods/*.jar app_mojo/src/main/assets/crypto-mods/ 2>/dev/null || true
          ls -la app_mojo/src/main/assets/crypto-mods/
      - name: Build APK
        working-directory: engine
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          chmod +x gradlew 2>/dev/null || gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew :app_mojo:assembleDebug --no-daemon --stacktrace
      - name: Stage APK
        run: |
          mkdir -p out
          find engine -type f -name "*.apk" -exec cp -v {} out/ \;
          ls -lah out
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-launcher-apk
          path: out/*.apk
          if-no-files-found: error
